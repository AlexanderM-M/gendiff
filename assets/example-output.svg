<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="598" viewBox="0 0 1120 598" role="img" aria-labelledby="title description">
<title id="title">GenDiff comparison: Baseline and Candidate</title><desc id="description">Different; 80.0% identity overlap.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1f2328}.title{font-size:28px;font-weight:700}.status{font-size:17px;font-weight:700}.sample{font-size:19px;font-weight:700}.count{font-size:24px;font-weight:700}.muted{font-size:13px;fill:#59636e}.section{font-size:17px;font-weight:700}.label{font-size:13px}.value{font-size:13px;font-weight:700;text-anchor:end}</style>
<rect width="1120" height="598" fill="#f6f8fa"/><rect x="24" y="24" width="1072" height="550" rx="12" fill="#fff" stroke="#d0d7de"/>
<text x="48" y="70" class="title">GenDiff</text><text x="1048" y="66" class="status" text-anchor="end" style="fill:#cf222e">Different</text>
<rect x="48" y="88" width="488" height="86" rx="8" fill="#f6f8fa" stroke="#d0d7de"/><text x="68" y="118" class="sample">Baseline</text><text x="68" y="148" class="count">5</text><text x="68" y="165" class="muted">records</text>
<rect x="560" y="88" width="488" height="86" rx="8" fill="#f6f8fa" stroke="#d0d7de"/><text x="580" y="118" class="sample">Candidate</text><text x="580" y="148" class="count">5</text><text x="580" y="165" class="muted">records</text>
<text x="48" y="206" class="section">Identity overlap</text><rect x="48" y="220" width="920" height="18" rx="6" fill="#eaeef2"/><rect x="48" y="220" width="736" height="18" rx="6" fill="#0969da"/><text x="1048" y="235" class="value">80.0%</text>
<text x="48" y="270" class="section">Record comparison</text><rect x="48" y="286" width="920" height="24" rx="6" fill="#eaeef2"/><rect x="48" y="286" width="307" height="24" fill="#1a7f37"/><rect x="355" y="286" width="306" height="24" fill="#bf8700"/><rect x="661" y="286" width="154" height="24" fill="#0969da"/><rect x="815" y="286" width="153" height="24" fill="#8250df"/>
<rect x="54" y="331" width="10" height="10" rx="2" fill="#1a7f37"/><text x="72" y="342" class="label">Identical: 2</text><rect x="564" y="331" width="10" height="10" rx="2" fill="#bf8700"/><text x="582" y="342" class="label">Modified: 2</text><rect x="54" y="359" width="10" height="10" rx="2" fill="#0969da"/><text x="72" y="370" class="label">Only in Baseline: 1</text><rect x="564" y="359" width="10" height="10" rx="2" fill="#8250df"/><text x="582" y="370" class="label">Only in Candidate: 1</text>
<text x="40" y="402" class="section">What changed</text><circle cx="55" cy="423" r="3" fill="#59636e"/><text x="68" y="428" class="label">Primary record change: mapping quality (100% of modified records).</text><circle cx="55" cy="447" r="3" fill="#59636e"/><text x="68" y="452" class="label">Mapping quality distribution changed by 40%; median remained 30.</text><circle cx="55" cy="471" r="3" fill="#59636e"/><text x="68" y="476" class="label">Differences are concentrated on chr1 (100% of located changes).</text>
<text x="40" y="502" class="section">Distribution shifts</text><text x="54" y="530" class="label">Mapping quality</text><rect x="310" y="515" width="550" height="14" rx="4" fill="#eaeef2"/><rect x="310" y="515" width="550" height="14" rx="4" fill="#0969da"/><text x="1040" y="530" class="value">40%</text>
</svg>
