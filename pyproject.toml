[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantiseq"
version = "1.1.0"
description = "Semantic comparison and regression testing for genomics files"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "SemantiSeq contributors"}]
keywords = ["bam", "bcf", "bioinformatics", "cram", "genomics", "vcf"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["pysam>=0.22"]

[project.urls]
Homepage = "https://github.com/AlexanderM-M/semantiseq"
Repository = "https://github.com/AlexanderM-M/semantiseq.git"
Issues = "https://github.com/AlexanderM-M/semantiseq/issues"

[project.optional-dependencies]
test = ["pytest>=7", "ruff>=0.8"]
multiqc = ["multiqc>=1.25"]

[project.scripts]
semantiseq = "semantiseq.cli:main"

[project.entry-points."multiqc.modules.v1"]
semantiseq = "semantiseq.multiqc:MultiqcModule"

[project.entry-points."multiqc.hooks.v1"]
config_loaded = "semantiseq.multiqc_config:configure"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
